owner: nishant-chauhan2427 # GitHub user that owns this repository
repo: ABC_Status

# Every URL is a repository secret ($NAME) so only the component names are public.
# Body checks matter: the gateway serves the frontend's HTML (200) for unknown
# paths, so a plain status-code check could report a dead API as "up".
sites:
  - name: Frontend
    url: $ABC_FRONTEND_URL # https://insights.abcconsultants.in/
    __dangerous__body_down_if_text_missing: 'id="root"'

  # Service vs database are split by reading the same /health two ways:
  #   DB up   → 200 {"status":"ok","database":"up",...}
  #   DB down → 503 {"status":"error","database":"down"}   ← service is alive
  #   Service down → gateway 502/504 / timeout, no JSON at all
  # A service monitor accepts 200 *and* 503 (the process answered) and only
  # needs the JSON key; the database monitor needs "database":"up".
  # If the service itself is down, its database can't be checked either,
  # so both read down — the service is then the root cause.

  - name: Shared Service
    url: $ABC_CORE_HEALTH_URL # https://insights.abcconsultants.in/abc/core/api/v1/health
    expectedStatusCodes: [200, 503]
    __dangerous__body_down_if_text_missing: '"database":'

  - name: Shared Database
    url: $ABC_CORE_HEALTH_URL
    __dangerous__body_down_if_text_missing: '"database":"up"'

  - name: AFS Service
    url: $ABC_AFS_HEALTH_URL # https://insights.abcconsultants.in/abc/afs/api/v1/health
    expectedStatusCodes: [200, 503]
    __dangerous__body_down_if_text_missing: '"database":'

  - name: AFS Database
    url: $ABC_AFS_HEALTH_URL
    __dangerous__body_down_if_text_missing: '"database":"up"'

  - name: Cache (Redis)
    url: $ABC_CORE_HEALTH_URL
    # Redis down → health still 200 (the app works without it), so it shows
    # as degraded (amber), not down. While the Shared DB is down the health
    # body carries no redis field, so this reads degraded then too.
    expectedStatusCodes: [200, 503]
    __dangerous__body_degraded_if_text_missing: '"redis":"up"'
    # No JSON at all = the service is down, so Redis can't be judged → down
    # (the down rule runs after the degraded one and wins).
    __dangerous__body_down_if_text_missing: '"database":'

# No GitHub-issue notifications go to anyone: alerts are e-mail only, to
# insights-support@abcconsultants.in, via the NOTIFICATION_EMAIL_SMTP* repo
# secrets. Upptime still records each incident as a (locked) issue — that is
# what the status page's incident history is built from.

status-website:
  # No custom domain yet — served at https://nishant-chauhan2427.github.io/ABC_Status
  # For e.g. status.abcconsultants.in: add `cname: status.abcconsultants.in`,
  # remove baseUrl, and point a CNAME DNS record at nishant-chauhan2427.github.io
  baseUrl: /ABC_Status
  logoUrl: https://raw.githubusercontent.com/nishant-chauhan2427/ABC_Status/master/assets/abc_logo.png
  name: ABC Platform Status
  introTitle: "**ABC Intelligence Suite** — platform status"
  introMessage: Live status of the ABC platform, checked every 5 minutes from outside our servers. Each component shows its uptime and incident history.
  navbar:
    - title: Status
      href: /
  # The home page's layout (90-day bars per component, day tooltips, past incidents).
  # Both files live in assets/, which Upptime copies to the site root after the build.
  # Full URLs on purpose: Sapper's export crawls every same-site link, and a relative
  # `status-ui.css` became a page folder that the asset copy then failed to overwrite
  # (EISDIR). With a custom domain (cname), change the host here too.
  scripts:
    - src: https://nishant-chauhan2427.github.io/ABC_Status/status-ui.js
  links:
    - rel: stylesheet
      href: https://nishant-chauhan2427.github.io/ABC_Status/status-ui.css

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
